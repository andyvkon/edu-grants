<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Community Aid Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />

  <style>
    :root {
      --glass: rgba(16, 21, 34, 0.72);
      --glass-strong: rgba(12, 17, 29, 0.9);
      --border: rgba(255,255,255,.1);
      --text: #f5f7fb;
      --muted: #a5adbd;
      --accent: #5a8fff;
      --accent-2: #2f6df6;
      --success: #5dd39e;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: #05070d;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      overflow: hidden;
    }

    #map { height: 100vh; width: 100%; }

    .leaflet-control-attribution {
      background: rgba(10,14,22,.4) !important;
      color: rgba(255,255,255,.35) !important;
      font-size: 10px;
      backdrop-filter: blur(10px);
    }

    .leaflet-control-zoom a {
      background: rgba(14,20,32,.72) !important;
      color: #fff !important;
      border-color: rgba(255,255,255,.08) !important;
      backdrop-filter: blur(12px);
    }

    .sidebar {
      position: absolute;
      top: 16px;
      right: 16px;
      bottom: 16px;
      width: 320px;
      background: var(--glass);
      backdrop-filter: blur(22px) saturate(140%);
      -webkit-backdrop-filter: blur(22px) saturate(140%);
      border: 1px solid var(--border);
      border-radius: 22px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      box-shadow: 0 24px 60px rgba(0,0,0,.35);
      overflow: hidden;
    }

    .sidebar-header {
      padding: 18px 18px 12px;
      border-bottom: 1px solid var(--border);
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .title-row h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: -.02em;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 5px rgba(93,211,158,.12);
      flex: 0 0 auto;
    }

    .subtitle {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .search-wrap {
      padding: 14px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    #search {
      min-width: 0;
      padding: 11px 12px;
      border-radius: 13px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.065);
      color: var(--text);
      outline: none;
      font-size: 14px;
      transition: border-color .22s ease, background .22s ease, box-shadow .22s ease;
    }

    #search:focus {
      border-color: rgba(90,143,255,.55);
      background: rgba(255,255,255,.085);
      box-shadow: 0 0 0 4px rgba(90,143,255,.1);
    }

    #clearSearch {
      border: 1px solid var(--border);
      background: rgba(255,255,255,.06);
      color: var(--text);
      padding: 0 12px;
      border-radius: 13px;
      cursor: pointer;
      opacity: .55;
      transition: opacity .2s ease, background .2s ease;
    }

    #clearSearch.enabled { opacity: 1; }
    #clearSearch:hover { background: rgba(255,255,255,.1); }

    .stats {
      padding: 0 16px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
    }

    .stats strong { color: var(--text); font-weight: 650; }

    .categories {
      padding: 0 12px 12px;
      display: grid;
      gap: 7px;
    }

    .category-btn {
      width: 100%;
      border: 0;
      border-radius: 14px;
      background: rgba(255,255,255,.055);
      color: var(--text);
      padding: 11px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      text-align: left;
      transition: transform .22s ease, background .22s ease, box-shadow .22s ease;
    }

    .category-btn:hover { transform: translateY(-1px); background: rgba(255,255,255,.085); }
    .category-btn.active {
      background: linear-gradient(180deg, rgba(90,143,255,.28), rgba(47,109,246,.18));
      box-shadow: inset 0 0 0 1px rgba(90,143,255,.22);
    }

    .cat-icon {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.08);
      flex: 0 0 auto;
    }

    .cat-icon svg { width: 20px; height: 20px; fill: #fff; }

    .list-title {
      padding: 4px 16px 8px;
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .resource-list {
      flex: 1;
      overflow: auto;
      padding: 0 10px 12px;
    }

    .resource-item {
      width: 100%;
      border: 0;
      color: var(--text);
      background: transparent;
      text-align: left;
      padding: 10px 10px;
      border-radius: 12px;
      cursor: pointer;
      transition: background .2s ease, transform .2s ease;
    }

    .resource-item:hover { background: rgba(255,255,255,.06); transform: translateX(-2px); }
    .resource-name { font-size: 13px; font-weight: 650; line-height: 1.25; }
    .resource-meta { margin-top: 3px; color: var(--muted); font-size: 11px; }

    .detail-card {
      position: absolute;
      right: 352px;
      top: 16px;
      bottom: 16px;
      width: 340px;
      background: var(--glass-strong);
      backdrop-filter: blur(24px) saturate(150%);
      -webkit-backdrop-filter: blur(24px) saturate(150%);
      border: 1px solid var(--border);
      border-radius: 22px;
      z-index: 1100;
      padding: 18px;
      overflow: auto;
      opacity: 0;
      transform: translateX(24px) scale(.985);
      pointer-events: none;
      transition: opacity .28s ease, transform .32s cubic-bezier(.22,.8,.22,1);
      box-shadow: 0 24px 60px rgba(0,0,0,.4);
    }

    .detail-card.active {
      opacity: 1;
      transform: translateX(0) scale(1);
      pointer-events: auto;
    }

    .detail-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 0;
      background: transparent;
      color: #8fb2ff;
      padding: 0;
      cursor: pointer;
      font-size: 13px;
      margin-bottom: 16px;
    }

    .detail-card h2 { margin: 0 0 8px; font-size: 22px; letter-spacing: -.02em; }
    .detail-card p { color: var(--muted); line-height: 1.45; font-size: 13px; }
    .detail-row { margin-top: 14px; }
    .detail-label { color: #7f8aa0; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
    .detail-value { margin-top: 4px; color: var(--text); font-size: 13px; }
    .detail-card a { color: #9bbaff; text-decoration: none; }

    .apple-marker {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #628ff8, #2f67e6);
      border: 1px solid rgba(255,255,255,.28);
      box-shadow: 0 0 0 6px rgba(83,129,238,.13), 0 8px 24px rgba(0,0,0,.5);
      transform: scale(.82);
      opacity: 0;
      animation: markerIn .32s cubic-bezier(.22,.8,.22,1) forwards;
    }

    .apple-marker svg { width: 24px; height: 24px; fill: #fff; }

    @keyframes markerIn {
      to { transform: scale(1); opacity: 1; }
    }

    .density-zone {
      transition: opacity .28s ease;
    }

    .map-status {
      position: absolute;
      left: 18px;
      top: 18px;
      z-index: 900;
      max-width: 340px;
      background: rgba(14,20,32,.68);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 14px;
      color: #dce4f5;
      padding: 10px 12px;
      font-size: 12px;
      box-shadow: 0 12px 28px rgba(0,0,0,.25);
      transition: opacity .25s ease, transform .25s ease;
    }

    .map-status.hidden { opacity: 0; transform: translateY(-6px); pointer-events: none; }

    .locate-btn {
      position: absolute;
      left: 18px;
      bottom: 22px;
      z-index: 900;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(14,20,32,.75);
      backdrop-filter: blur(14px);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 10px 26px rgba(0,0,0,.3);
      font-size: 18px;
    }

    @media (max-width: 820px) {
      .sidebar {
        top: auto;
        left: 10px;
        right: 10px;
        bottom: 10px;
        width: auto;
        max-height: 48vh;
      }
      .detail-card {
        left: 10px;
        right: 10px;
        top: auto;
        bottom: 10px;
        width: auto;
        max-height: 62vh;
      }
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="mapStatus" class="map-status">Loading resources…</div>

  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="title-row">
        <h1>Community Aid Map</h1>
        <span class="status-dot" aria-hidden="true"></span>
      </div>
      <div class="subtitle">Cook County pilot · ZIP-first resource discovery</div>
    </div>

    <div class="search-wrap">
      <input id="search" inputmode="numeric" maxlength="5" placeholder="Search ZIP or resource name" />
      <button id="clearSearch" type="button" aria-label="Clear search">Clear</button>
    </div>

    <div class="stats">
      <span><strong id="count">0</strong> resources</span>
      <span id="areaLabel">All areas</span>
    </div>

    <div class="categories">
      <button class="category-btn active" data-type="all">
        <span class="cat-icon">
          <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Zm6.92 8H15.9a14.3 14.3 0 0 0-1.05-4.45A7.03 7.03 0 0 1 18.92 11ZM12 5c.88 1.06 1.58 3.06 1.86 6h-3.72C10.42 8.06 11.12 6.06 12 5Zm-2.85 1.55A14.3 14.3 0 0 0 8.1 11H5.08a7.03 7.03 0 0 1 4.07-4.45ZM5.08 13H8.1c.16 1.7.52 3.2 1.05 4.45A7.03 7.03 0 0 1 5.08 13ZM12 19c-.88-1.06-1.58-3.06-1.86-6h3.72c-.28 2.94-.98 4.94-1.86 6Zm2.85-1.55A14.3 14.3 0 0 0 15.9 13h3.02a7.03 7.03 0 0 1-4.07 4.45Z"/></svg>
        </span>
        All resources
      </button>

      <button class="category-btn" data-type="food">
        <span class="cat-icon">
          <svg viewBox="0 0 24 24"><path d="M3.5 11.7c0-4.15 3.48-7.2 8.5-7.2s8.5 3.05 8.5 7.2v3.15c0 2.88-2.2 5.15-5 5.15h-7c-2.8 0-5-2.27-5-5.15V11.7Zm3.1-1.25c.75.35 1.55.42 2.2.18.8-.3 1.24-.97 1.45-1.72-.92-.3-1.9-.18-2.6.25-.55.34-.9.8-1.05 1.29Zm5.2-2.15c.72.27 1.45.24 2.02-.06.67-.35 1.02-1 1.13-1.7-.85-.2-1.72-.03-2.32.43-.47.36-.73.82-.83 1.33Zm3.05 3.05c.72.25 1.45.2 2.03-.12.66-.37.99-1.02 1.08-1.73-.85-.17-1.72.03-2.3.5-.45.36-.7.82-.81 1.34Z"/></svg>
        </span>
        Food assistance
      </button>

      <button class="category-btn" data-type="shelter">
        <span class="cat-icon"><svg viewBox="0 0 24 24"><path d="M12 3 2.8 10.3l1.25 1.56L5.5 10.7V21h5.25v-5.2h2.5V21h5.25V10.7l1.45 1.16 1.25-1.56L12 3Z"/></svg></span>
        Shelter & housing
      </button>

      <button class="category-btn" data-type="medical">
        <span class="cat-icon"><svg viewBox="0 0 24 24"><path d="M9.4 3h5.2v6.4H21v5.2h-6.4V21H9.4v-6.4H3V9.4h6.4V3Z"/></svg></span>
        Medical care
      </button>

      <button class="category-btn" data-type="legal">
        <span class="cat-icon"><svg viewBox="0 0 24 24"><path d="M11 3h2v2.1l5.2 2.1-.75 1.85L13 7.25V17h4v2H7v-2h4V7.25L6.55 9.05 5.8 7.2 11 5.1V3Zm-6.3 7.2h4.6L7 14.1 4.7 10.2Zm10 0h4.6L17 14.1l-2.3-3.9Z"/></svg></span>
        Legal aid
      </button>

      <button class="category-btn" data-type="jobs">
        <span class="cat-icon"><svg viewBox="0 0 24 24"><path d="M8 4h8v3h4a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h4V4Zm2 3h4V6h-4v1Zm-6 4v7h16v-7h-6v2h-4v-2H4Z"/></svg></span>
        Employment help
      </button>
    </div>

    <div class="list-title">Visible resources</div>
    <div id="resourceList" class="resource-list"></div>
  </aside>

  <section id="detailCard" class="detail-card" aria-live="polite"></section>
  <button class="locate-btn" id="locateBtn" type="button" aria-label="Use my location">⌖</button>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <script>
    const DATA_URL = "./data/resources.sample.json";

    const map = L.map("map", {
      zoomControl: true,
      attributionControl: true,
      preferCanvas: true
    }).setView([42.055, -88.02], 11);

    map.attributionControl.setPrefix("");

    L.tileLayer(
      "https://tiles.stadiamaps.com/tiles/alidade_smooth_dark/{z}/{x}/{y}{r}.png",
      {
        maxZoom: 18,
        updateWhenIdle: true,
        updateWhenZooming: false,
        keepBuffer: 1,
        detectRetina: false,
        attribution: "&copy; Stadia Maps &copy; OpenMapTiles &copy; OpenStreetMap"
      }
    ).addTo(map);

    // Keep clustering available for large future datasets, but show individual markers at our normal working zoom.
    const clusters = L.markerClusterGroup({
      maxClusterRadius: 28,
      disableClusteringAtZoom: 10,
      showCoverageOnHover: false,
      spiderfyOnMaxZoom: true,
      removeOutsideVisibleBounds: true,
      animate: true
    });
    map.addLayer(clusters);

    const ICONS = {
      food: `<svg viewBox="0 0 24 24"><path d="M3.5 11.7c0-4.15 3.48-7.2 8.5-7.2s8.5 3.05 8.5 7.2v3.15c0 2.88-2.2 5.15-5 5.15h-7c-2.8 0-5-2.27-5-5.15V11.7Zm3.1-1.25c.75.35 1.55.42 2.2.18.8-.3 1.24-.97 1.45-1.72-.92-.3-1.9-.18-2.6.25-.55.34-.9.8-1.05 1.29Zm5.2-2.15c.72.27 1.45.24 2.02-.06.67-.35 1.02-1 1.13-1.7-.85-.2-1.72-.03-2.32.43-.47.36-.73.82-.83 1.33Zm3.05 3.05c.72.25 1.45.2 2.03-.12.66-.37.99-1.02 1.08-1.73-.85-.17-1.72.03-2.3.5-.45.36-.7.82-.81 1.34Z"/></svg>`,
      shelter: `<svg viewBox="0 0 24 24"><path d="M12 3 2.8 10.3l1.25 1.56L5.5 10.7V21h5.25v-5.2h2.5V21h5.25V10.7l1.45 1.16 1.25-1.56L12 3Z"/></svg>`,
      medical: `<svg viewBox="0 0 24 24"><path d="M9.4 3h5.2v6.4H21v5.2h-6.4V21H9.4v-6.4H3V9.4h6.4V3Z"/></svg>`,
      legal: `<svg viewBox="0 0 24 24"><path d="M11 3h2v2.1l5.2 2.1-.75 1.85L13 7.25V17h4v2H7v-2h4V7.25L6.55 9.05 5.8 7.2 11 5.1V3Zm-6.3 7.2h4.6L7 14.1 4.7 10.2Zm10 0h4.6L17 14.1l-2.3-3.9Z"/></svg>`,
      jobs: `<svg viewBox="0 0 24 24"><path d="M8 4h8v3h4a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h4V4Zm2 3h4V6h-4v1Zm-6 4v7h16v-7h-6v2h-4v-2H4Z"/></svg>`,
      other: `<svg viewBox="0 0 24 24"><path d="M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16Zm-1 4h2v5h-2V8Zm0 7h2v2h-2v-2Z"/></svg>`
    };

    let DATA = [];
    let currentType = "all";
    let currentQuery = "";
    let densityLayer = null;
    let activeRenderToken = 0;

    const $ = (id) => document.getElementById(id);
    const searchEl = $("search");
    const countEl = $("count");
    const areaLabelEl = $("areaLabel");
    const resourceListEl = $("resourceList");
    const detailCardEl = $("detailCard");
    const clearSearchEl = $("clearSearch");
    const mapStatusEl = $("mapStatus");

    function normalizeType(type) {
      const t = String(type || "").toLowerCase();
      if (t.includes("food")) return "food";
      if (t.includes("shelter") || t.includes("housing")) return "shelter";
      if (t.includes("medical") || t.includes("clinic") || t.includes("health")) return "medical";
      if (t.includes("legal")) return "legal";
      if (t.includes("job") || t.includes("employment") || t.includes("workforce")) return "jobs";
      return "other";
    }

    function flattenData(raw) {
      if (!Array.isArray(raw)) return [];
      return raw.flat(Infinity).filter(item => item && typeof item === "object" && !Array.isArray(item));
    }

    function normalizeResource(r, index) {
      const lat = Number(r.lat ?? r.latitude);
      const lng = Number(r.lng ?? r.lon ?? r.longitude);
      return {
        ...r,
        id: r.id ?? `resource_${index + 1}`,
        type: normalizeType(r.type),
        name: String(r.name || "Unnamed resource").trim(),
        lat,
        lng,
        zip: String(r.zip || "").trim(),
        city: String(r.city || "").trim(),
        address: String(r.address || "").trim(),
        phone: String(r.phone || "").trim(),
        website: String(r.website || "").trim(),
        eligibility: String(r.eligibility || "").trim(),
        notes: String(r.notes || "").trim()
      };
    }

    function isValidResource(r) {
      return r.name && Number.isFinite(r.lat) && Number.isFinite(r.lng) && Math.abs(r.lat) <= 90 && Math.abs(r.lng) <= 180;
    }

    function getFilteredData() {
      const q = currentQuery.trim().toLowerCase();
      return DATA.filter(r => {
        const typeOk = currentType === "all" || r.type === currentType;
        if (!typeOk) return false;
        if (!q) return true;
        return [r.name, r.zip, r.city, r.address].some(value => String(value || "").toLowerCase().includes(q));
      });
    }

    function createMarkerIcon(type) {
      return L.divIcon({
        className: "",
        html: `<div class="apple-marker ${type}">${ICONS[type] || ICONS.other}</div>`,
        iconSize: [42, 42],
        iconAnchor: [21, 21]
      });
    }

    function addMarker(resource) {
      const marker = L.marker([resource.lat, resource.lng], {
        icon: createMarkerIcon(resource.type),
        keyboard: true,
        title: resource.name
      });
      marker.on("click", () => showDetail(resource));
      clusters.addLayer(marker);
      return marker;
    }

    function drawDensityZone(points) {
      if (densityLayer) {
        map.removeLayer(densityLayer);
        densityLayer = null;
      }
      if (!points.length) return;

      densityLayer = L.layerGroup();
      points.forEach(point => {
        L.circle([point.lat, point.lng], {
          radius: 1500,
          stroke: true,
          color: "#5787ef",
          weight: 1,
          opacity: .2,
          fillColor: "#4f7ee8",
          fillOpacity: .075,
          interactive: false,
          className: "density-zone"
        }).addTo(densityLayer);
      });
      densityLayer.addTo(map);
    }

    function fitToData(points, options = {}) {
      if (!points.length) return;
      const bounds = L.latLngBounds(points.map(p => [p.lat, p.lng]));
      const rightPad = window.innerWidth > 820 ? 360 : 40;
      map.fitBounds(bounds, {
        paddingTopLeft: [50, 50],
        paddingBottomRight: [rightPad, 60],
        maxZoom: options.maxZoom ?? 12,
        animate: true,
        duration: .65
      });
    }

    function updateResourceList(points) {
      resourceListEl.innerHTML = "";
      if (!points.length) {
        resourceListEl.innerHTML = `<div style="padding:10px;color:var(--muted);font-size:12px;">No matching resources.</div>`;
        return;
      }
      points.forEach(resource => {
        const btn = document.createElement("button");
        btn.className = "resource-item";
        btn.type = "button";
        btn.innerHTML = `
          <div class="resource-name">${escapeHtml(resource.name)}</div>
          <div class="resource-meta">${escapeHtml(resource.zip || "No ZIP")} · ${escapeHtml(resource.city || "")}</div>
        `;
        btn.addEventListener("click", () => {
          map.flyTo([resource.lat, resource.lng], Math.max(map.getZoom(), 14), { duration: .7 });
          setTimeout(() => showDetail(resource), 180);
        });
        resourceListEl.appendChild(btn);
      });
    }

    function updateAreaLabel(points) {
      if (!currentQuery) {
        areaLabelEl.textContent = currentType === "all" ? "All areas" : "Filtered";
        return;
      }
      const zips = [...new Set(points.map(p => p.zip).filter(Boolean))];
      areaLabelEl.textContent = zips.length === 1 ? `ZIP ${zips[0]}` : `${zips.length || 0} ZIPs`;
    }

    function render({ fit = false } = {}) {
      const token = ++activeRenderToken;
      const points = getFilteredData();
      countEl.textContent = points.length;
      clearSearchEl.classList.toggle("enabled", Boolean(currentQuery));
      updateAreaLabel(points);
      updateResourceList(points);

      // A short fade gap makes category changes feel intentional rather than abrupt.
      clusters.eachLayer(layer => {
        const el = layer.getElement && layer.getElement();
        if (el) el.style.opacity = "0";
      });

      window.setTimeout(() => {
        if (token !== activeRenderToken) return;
        clusters.clearLayers();
        points.forEach(addMarker);
        drawDensityZone(points);
        if (fit && points.length) fitToData(points);
      }, 140);
    }

    function showDetail(r) {
      const website = r.website ? `<div class="detail-row"><div class="detail-label">Website</div><div class="detail-value"><a href="${escapeAttr(r.website)}" target="_blank" rel="noopener">Open website</a></div></div>` : "";
      const phone = r.phone ? `<div class="detail-row"><div class="detail-label">Phone</div><div class="detail-value"><a href="tel:${escapeAttr(r.phone)}">${escapeHtml(r.phone)}</a></div></div>` : "";
      const eligibility = r.eligibility ? `<div class="detail-row"><div class="detail-label">Eligibility</div><div class="detail-value">${escapeHtml(r.eligibility)}</div></div>` : "";
      const notes = r.notes ? `<div class="detail-row"><div class="detail-label">Notes</div><div class="detail-value">${escapeHtml(r.notes)}</div></div>` : "";

      detailCardEl.innerHTML = `
        <button class="detail-back" type="button" onclick="closeDetail()">← Back to map</button>
        <h2>${escapeHtml(r.name)}</h2>
        <p>${escapeHtml([r.address, r.city, r.zip].filter(Boolean).join(", "))}</p>
        ${phone}
        ${website}
        ${eligibility}
        ${notes}
      `;
      requestAnimationFrame(() => detailCardEl.classList.add("active"));
    }

    function closeDetail() {
      detailCardEl.classList.remove("active");
    }
    window.closeDetail = closeDetail;

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttr(value) {
      return escapeHtml(value);
    }

    document.querySelectorAll(".category-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".category-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentType = btn.dataset.type;
        closeDetail();
        render({ fit: true });
      });
    });

    let searchTimer = null;
    searchEl.addEventListener("input", event => {
      currentQuery = event.target.value;
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        closeDetail();
        render({ fit: Boolean(currentQuery.trim()) });
      }, 180);
    });

    clearSearchEl.addEventListener("click", () => {
      if (!currentQuery) return;
      currentQuery = "";
      searchEl.value = "";
      closeDetail();
      render({ fit: true });
      searchEl.focus();
    });

    $("locateBtn").addEventListener("click", () => {
      if (!navigator.geolocation) return;
      navigator.geolocation.getCurrentPosition(
        pos => map.flyTo([pos.coords.latitude, pos.coords.longitude], 13, { duration: .8 }),
        () => {
          mapStatusEl.textContent = "Location access was not available.";
          mapStatusEl.classList.remove("hidden");
          setTimeout(() => mapStatusEl.classList.add("hidden"), 2500);
        },
        { enableHighAccuracy: false, timeout: 7000 }
      );
    });

    async function loadData() {
      try {
        const response = await fetch(DATA_URL, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const raw = await response.json();
        const normalized = flattenData(raw).map(normalizeResource);
        const valid = normalized.filter(isValidResource);
        const invalidCount = normalized.length - valid.length;

        DATA = valid;
        render({ fit: true });

        mapStatusEl.textContent = invalidCount
          ? `Loaded ${valid.length} resources · skipped ${invalidCount} invalid record${invalidCount === 1 ? "" : "s"}`
          : `Loaded ${valid.length} resources`;
        setTimeout(() => mapStatusEl.classList.add("hidden"), 1800);
      } catch (error) {
        console.error("Failed to load resources:", error);
        DATA = [];
        render();
        mapStatusEl.textContent = `Could not load ${DATA_URL}. Check the local server and JSON syntax.`;
        mapStatusEl.classList.remove("hidden");
      }
    }

    loadData();
  </script>
</body>
</html>
